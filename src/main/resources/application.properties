spring.application.name=nature-event-backend

server.port=${PORT:8080}


# =========================================================
# PostgreSQL
# =========================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=nature_event}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / Hibernate
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =========================================================
# Application
# =========================================================

app.base-url=http://localhost:8080

# For deployment:
# app.base-url=https://yourdomain.com


# =========================================================
# EVENT IMAGE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=uploads/event-images


# =========================================================
# JWT
# =========================================================

jwt.secret=NatureEventSecretKeyForJwtAuthentication2026Secure