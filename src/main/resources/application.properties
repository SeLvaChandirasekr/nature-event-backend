spring.application.name=nature-event-backend

server.port=${PORT:8080}


# =========================================================
# Supabase PostgreSQL Database Configuration
# =========================================================

# Supabase IPv4 Connection Pooler (Required for Render and cloud hosts without IPv6):
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.souomrvcxkxptrmjoljf}
spring.datasource.password=KVNzZwJ5P#iQB6S
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Pool (Optimized for Supabase Cloud Connections)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000

# =========================================================
# JPA / Hibernate
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# =========================================================
# Application
# =========================================================

app.base-url=${APP_BASE_URL:http://localhost:8080}

# For deployment:
# app.base-url=https://yourdomain.com


# =========================================================
# EVENT IMAGE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=uploads/event-images


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET:NatureEventSecretKeyForJwtAuthentication2026Secure}